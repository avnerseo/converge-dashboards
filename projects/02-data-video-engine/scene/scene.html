<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Converge daily scene</title>
<link rel="stylesheet" href="scene.css">
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="glow"></div>
  <div id="glow-b"></div>

  <header id="topbar">
    <div class="lockup">
      <span class="mark"></span>
      <span class="lockup-text">
        <span class="wordmark" id="wordmark"></span>
        <span class="tagline" id="tagline"></span>
      </span>
    </div>
    <span class="datepill ltr" id="datepill"></span>
  </header>

  <main id="frames"></main>

  <footer id="botbar">
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="disclaimer" id="disclaimer"></div>
  </footer>
</div>
<script src="scene.js"></script>
</body>
</html>
