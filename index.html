<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Converge — מנוע מעקב מניות אטרקטיביות | שוק ארה"ב</title>
<style>
  :root{
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --card-border:    rgba(11,11,11,0.08);
    --series-1:       #2a78d6;
    --highlight-bg:   #e3edfb;
    --highlight-ink:  #1c5cab;
    --good:           #0ca30c;
    --good-bg:        #e8f7e8;
    --warning:        #fab219;
    --warning-bg:     #fff6e0;
    --serious:        #ec835a;
    --serious-bg:     #fdeee7;
    --critical:       #d03b3b;
    --critical-bg:    #fbe7e7;
    --chip-bg:        #f0efec;
    --tier1-bg:       linear-gradient(135deg,#eef4fc,#f9f9f7);
    --shadow:         0 1px 2px rgba(11,11,11,0.04), 0 8px 24px rgba(11,11,11,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --card-border:    rgba(255,255,255,0.12);
      --series-1:       #3987e5;
      --highlight-bg:   #152a42;
      --highlight-ink:  #86b6ef;
      --good:           #0ca30c;
      --good-bg:        #123312;
      --warning:        #fab219;
      --warning-bg:     #3a2c05;
      --serious:        #ec835a;
      --serious-bg:     #3a1f12;
      --critical:       #e66767;
      --critical-bg:    #3a1414;
      --chip-bg:        #262624;
      --tier1-bg:       linear-gradient(135deg,#141c26,#1a1a19);
      --shadow:         0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --card-border:    rgba(255,255,255,0.12);
    --series-1:       #3987e5;
    --highlight-bg:   #152a42;
    --highlight-ink:  #86b6ef;
    --good:           #0ca30c;
    --good-bg:        #123312;
    --warning:        #fab219;
    --warning-bg:     #3a2c05;
    --serious:        #ec835a;
    --serious-bg:     #3a1f12;
    --critical:       #e66767;
    --critical-bg:    #3a1414;
    --chip-bg:        #262624;
    --tier1-bg:       linear-gradient(135deg,#141c26,#1a1a19);
    --shadow:         0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--page); color:var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height:1.55;
  }
  .ltr{ direction:ltr; unicode-bidi:isolate; font-variant-numeric: tabular-nums; }
  .wrap{ max-width:1180px; margin:0 auto; padding:24px 20px 80px; }
  a{ color:var(--series-1); }
  ::selection{ background:var(--highlight-bg); color:var(--highlight-ink); }

  header.top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:6px;}
  .brand-lockup{ display:flex; align-items:center; gap:10px; margin-bottom:16px; direction:ltr; }
  .brand-mark{ width:34px; height:34px; border-radius:9px; background:var(--series-1); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:var(--shadow); }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-word{ font-size:16.5px; font-weight:700; letter-spacing:0.1px; color:var(--text-primary); }
  .brand-tm{ font-size:9px; font-weight:600; vertical-align:super; margin-inline-start:2px; color:var(--text-muted); }
  .brand-tagline{ font-size:9.5px; font-weight:600; letter-spacing:1.3px; color:var(--text-muted); text-transform:uppercase; margin-top:2px; }
  h1{ font-size:25px; margin:0 0 6px; letter-spacing:-0.2px; }
  .subtitle{ color:var(--text-secondary); font-size:14.5px; max-width:760px; }
  .meta-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .badge{ display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:20px; font-size:12.5px; background:var(--chip-bg); color:var(--text-secondary); border:1px solid var(--card-border); }
  .theme-toggle{ cursor:pointer; border:1px solid var(--card-border); background:var(--surface-1); color:var(--text-primary); border-radius:20px; padding:7px 14px; font-size:13px; }
  .theme-toggle:hover{ background:var(--chip-bg); }

  .disclaimer{ margin:18px 0 18px; padding:14px 16px; border-radius:10px; background:var(--warning-bg); border:1px solid var(--card-border); font-size:13px; color:var(--text-secondary); }
  .disclaimer b{ color:var(--text-primary); }
PLACEHOLDER_TRUNCATED
</style>
</head>
<body></body>
</html>
