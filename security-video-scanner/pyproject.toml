[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vscan"
version = "0.1.0"
description = "Search security-camera footage by face or by natural-language instruction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
# the on-premise web application
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
# natural-language search through the Claude API
ask = ["anthropic>=1.0"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
vscan = "vscan.cli:main"
vscan-server = "vscan_server.app:main"

[tool.setuptools]
packages = ["vscan", "vscan_server"]

[tool.setuptools.package-data]
vscan_server = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
